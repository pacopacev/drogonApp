<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <title>Register</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="/assets/flowbit.png" class="img-fluid mb-3" alt="Flowbit Logo" style="max-width: 150px;">
                <h2 class="font-weight-bold mb-0">Create Account</h2>
                <p class="text-muted">Sign up for a new account</p>
            </div>

            <form id="registerForm" action="/register" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person me-1"></i>Username
                    </label>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           placeholder="Choose a username" 
                           name="username" 
                           required>
                    <div class="form-text">Choose a unique username (3-20 characters)</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope me-1"></i>Email Address
                    </label>
                    <input type="email" 
                           class="form-control" 
                           id="email" 
                           placeholder="your@email.com" 
                           name="email" 
                           required>
                    <div class="form-text">We'll never share your email with anyone else</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock me-1"></i>Password
                    </label>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           placeholder="Create a password" 
                           name="password" 
                           required>
                    <div class="form-text">At least 8 characters with letters and numbers</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        <i class="bi bi-lock-fill me-1"></i>Confirm Password
                    </label>
                    <input type="password" 
                           class="form-control" 
                           id="confirmPassword" 
                           placeholder="Confirm your password" 
                           name="confirmPassword" 
                           required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="/terms" class="text-decoration-none">Terms of Service</a> 
                        and <a href="/privacy" class="text-decoration-none">Privacy Policy</a>
                    </label>
                </div>

                <div class="d-grid mb-3">
                    <button class="btn btn-success btn-lg" type="submit" title="Register">
                        <i class="bi bi-person-plus me-2"></i>Create Account
                    </button>
                </div>

                <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                <div id="successfulMessage" class="alert alert-success mt-3 d-none"></div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-2">
                    Already have an account? 
                    <a href="/login" class="text-decoration-none fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </a>
                </p>
                <p class="mb-0">
                    <a href="/" class="text-decoration-none">
                        <i class="bi bi-house me-1"></i>Back to Home
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Clear previous messages
        document.getElementById('errorMessage').classList.add('d-none');
        document.getElementById('successfulMessage').classList.add('d-none');
        
        // Get form values
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const email = document.getElementById('email').value.trim();
        
        // Validation
        if (!username || !password || !email) {
            showError('Please fill in all fields');
            return;
        }
        
        if (password !== confirmPassword) {
            showError('Passwords do not match');
            return;
        }
        
        if (password.length < 6) {
            showError('Password must be at least 6 characters');
            return;
        }
        
        if (!document.getElementById('terms').checked) {
            showError('Please accept the terms and conditions');
            return;
        }
        
        // Show loading state
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Success
                document.getElementById('successfulMessage').textContent = 
                    data.message || 'Account created successfully!';
                document.getElementById('successfulMessage').classList.remove('d-none');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
            } else {
                // Error from server
                showError(data.error || 'Registration failed');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Registration error:', error);
            showError('Network error. Please check your connection.');
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
    
    function showError(message) {
        const errorElement = document.getElementById('errorMessage');
        errorElement.textContent = message;
        errorElement.classList.remove('d-none');
        
        // Scroll to error
        errorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    
    // Real-time password validation
    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (confirmPassword && password !== confirmPassword) {
            document.getElementById('confirmPassword').classList.add('is-invalid');
        } else {
            document.getElementById('confirmPassword').classList.remove('is-invalid');
        }
    });
    
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        
        if (this.value && password !== this.value) {
            this.classList.add('is-invalid');
        } else {
            this.classList.remove('is-invalid');
        }
    });
    
    // Clear error when user starts typing
    document.getElementById('username').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
    
    document.getElementById('email').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
    </script>
</body>
</html>
