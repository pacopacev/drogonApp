<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <title>Fb Login</title>
    <style>
        body { 
            /* font-family: Arial, sans-serif;
            font-size: 13px; */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #f8f9fa;
        }
        h3 { color: #333; }
        .greeting {
            /* font-size: 1.5em; */
            color: #667eea;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
    <div class="card-body p-4 p-md-1">
        <div class="text-center mb-4">
            <img src="/assets/flowbit.png" class="img-fluid mb-3" alt="Flowbit Logo" style="max-width: 150px;">
            <h2 class="font-weight-bold mb-0">Login</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <form id="loginForm" action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" 
                       class="form-control" 
                       id="username" 
                       placeholder="Enter your username or email" 
                       name="username" 
                       required>
                <div class="form-text">Use your registered username or email address</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" 
                       class="form-control" 
                       id="password" 
                       placeholder="Enter your password" 
                       name="password" 
                       required>
                <div class="form-text">
                    <a href="/forgot-password" class="text-decoration-none small">Forgot password?</a>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button class="btn btn-success btn-lg" type="submit" title="Login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </div>

            <div class="text-center mb-3">
                <div class="d-inline-flex align-items-center">
                    <span class="me-2">Don't have an account?</span>
                    <a href="/register" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-person-plus me-1"></i>Register
                    </a>
                </div>
            </div>

            <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>

            <div id="capsLockWarning" class="alert alert-warning mt-3 d-none">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Caps Lock is ON
            </div>


        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="/" class="text-decoration-none">
                <i class="bi bi-house me-1"></i>Back to Home
            </a>
        </div>
    </div>
</div> 

    <script>
            //Caps lock detection can be added here if needed
        const passwordInput = document.getElementById('password');
        const warning = document.getElementById('capsLockWarning');

        passwordInput.addEventListener('keyup', function(event) {
            // console.log('Key pressed:', event.key);
            if (event.getModifierState('CapsLock')) {
                warning.classList.remove('d-none');
            } else {
                warning.classList.add('d-none');
            }
        });
</script>
    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        // Basic validation
        if (!username || !password) {
            document.getElementById('errorMessage').textContent = 'Please fill in all fields';
            document.getElementById('errorMessage').classList.remove('d-none');
            return;
        }
        
        // Clear previous errors
        const errorElement = document.getElementById('errorMessage');
        errorElement.classList.add('d-none');
        
        // Show loading state
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
        submitBtn.disabled = true;
        
        try {
        const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    
        const data = await response.json();
        console.log('Response status:', response.status);
        console.log('Response data:', data);
    
    if (response.status === 200 && data.success) {
        // Successful login
        console.log('✅ Login successful');
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return');
        const redirectTo = returnUrl || '/dashboard';
        console.log('Redirecting to:', redirectTo);
            
            // Small delay for better UX
            setTimeout(() => {
                window.location.href = redirectTo;
            }, 500);
        // Store token if available
        if (data.token) {
            localStorage.setItem('auth_token', data.token);
        }
        
        // Store user data if available
        if (data.user) {
            localStorage.setItem('user_data', JSON.stringify(data.user));
        }
        
        // Redirect to dashboard
        window.location.href = '/dashboard';
    } else {
        // Failed login
        console.log('❌ Login failed');
        
        // Get error message
        const errorMsg = data.error || 
                        data.message || 
                        (response.status === 401 ? 'Invalid username or password' : 'Login failed');
        
        // Show error
        const errorElement = document.getElementById('errorMessage');
        errorElement.textContent = errorMsg;
        errorElement.classList.remove('d-none');
        
        // Reset button
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        
        // Focus password for retry
        document.getElementById('password').focus();
        document.getElementById('password').select();
    }
} catch (error) {
    console.error('Network error:', error);
    // ... error handling ...
}
        
        function showError(message) {
            errorElement.textContent = message;
            errorElement.classList.remove('d-none');
            
            // Reset button
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            // Focus on password field for retry
            document.getElementById('password').focus();
            document.getElementById('password').select();
        }
    });
    
    // Clear error when user starts typing
    document.getElementById('username').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
    
    document.getElementById('password').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
</script>
</body>
</html>
