<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <title>Login</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h3 { color: #333; }
        .greeting {
            font-size: 1.5em;
            color: #667eea;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Welcome to the Login Page</h3>
        <div class="greeting">

            <form id="loginForm" action="/login" method="post">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>
                <button class="btn btn-success" type="submit" title="Login">Login
                </button>
            </form>
        <p class="mt-3"><a href="/">← Back to Home</a></p>
        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
   
        </div>
        </div>  
    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        // Basic validation
        if (!username || !password) {
            document.getElementById('errorMessage').textContent = 'Please fill in all fields';
            document.getElementById('errorMessage').classList.remove('d-none');
            return;
        }
        
        // Clear previous errors
        const errorElement = document.getElementById('errorMessage');
        errorElement.classList.add('d-none');
        
        // Show loading state
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            // Check if response is JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                throw new Error('Server returned non-JSON response');
            }
            
            const data = await response.json();
            console.log('Login response:', data);
            
            if (response.ok && (data.success === true && data.token)) {
                // Login successful
                // Optionally store token in localStorage
                if (data.token) {
                    localStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('auth_token', data.token);
                }
                
                if (data.user) {
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    sessionStorage.setItem('user_data', JSON.stringify(data.user));
                }
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 300);
            } else {
                // Show error from server
                const errorMsg = data.error || data.message || `Login failed (${response.status})`;
                showError(errorMsg);
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('Network error. Please check your connection.');
        }
        
        function showError(message) {
            errorElement.textContent = message;
            errorElement.classList.remove('d-none');
            
            // Reset button
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            // Focus on password field for retry
            document.getElementById('password').focus();
            document.getElementById('password').select();
        }
    });
    
    // Clear error when user starts typing
    document.getElementById('username').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
    
    document.getElementById('password').addEventListener('input', () => {
        document.getElementById('errorMessage').classList.add('d-none');
    });
</script>
</body>
</html>
